
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="xox.css">
</head>
<body>
    <div class="container">
        <h1 style="font-size: 100px; color: brown; font-weight: 900; font-family: 'Times New Roman', Times, serif;">TIC-TAC-TOE</h1>
        <div class="board">
            <div id="cell-0" class="cell" onclick="handleClick(this, 0)"></div>
            <div id="cell-1" class="cell" onclick="handleClick(this, 1)"></div>
            <div id="cell-2" class="cell" onclick="handleClick(this, 2)"></div>
            <div id="cell-3" class="cell" onclick="handleClick(this, 3)"></div>
            <div id="cell-4" class="cell" onclick="handleClick(this, 4)"></div>
            <div id="cell-5" class="cell" onclick="handleClick(this, 5)"></div>
            <div id="cell-6" class="cell" onclick="handleClick(this, 6)"></div>
            <div id="cell-7" class="cell" onclick="handleClick(this, 7)"></div>
            <div id="cell-8" class="cell" onclick="handleClick(this, 8)"></div>
        </div>
        <div id="status"></div>
        <button onclick="resetgame()"><B>REPLAY</B></button>
    </div>
    <script src="xox.js"></script>
</body>
</html>
